<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Register | Leaf & Grain</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Outfit:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <nav>
    <div class="brand"><a href="index.html">Leaf & Grain</a></div>
  </nav>

  <div class="auth-container">
    <h2>Register</h2>
    <div id="error-msg" class="error-message"></div>
    <form id="register-form">
      <div class="form-group">
        <label>Name</label>
        <input type="text" id="name" required>
      </div>
      <div class="form-group">
        <label>Email</label>
        <input type="email" id="email" required>
      </div>
      <div class="form-group">
        <label>Password</label>
        <input type="password" id="password" required>
      </div>
      <button type="submit" class="btn" style="width: 100%">Sign Up</button>
    </form>
    <p style="margin-top: 1rem; text-align: center;">
      Already have an account? <a href="login.html" style="color: var(--accent-orange); text-decoration: underline;">Login</a>
    </p>
  </div>

  <script src="app.js"></script>
  <script>
    document.getElementById('register-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const name = document.getElementById('name').value;
      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;
      const errorMsg = document.getElementById('error-msg');
      
      try {
        const res = await fetch(`${API_URL}/auth/register`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ name, email, password }),
          credentials: 'include'
        });
        if (res.ok) {
          window.location.href = 'index.html';
        } else {
          const data = await res.json();
          errorMsg.textContent = data.error || 'Registration failed';
          errorMsg.style.display = 'block';
        }
      } catch (err) {
        errorMsg.textContent = 'Network error';
        errorMsg.style.display = 'block';
      }
    });
  </script>
</body>
</html>
