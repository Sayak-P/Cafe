services:
  # 1. Backend Web Service (Express API)
  - type: web
    name: leaf-and-grain-backend
    runtime: node
    plan: free
    rootDir: leaf-and-grain-backend
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: JWT_SECRET
        generateValue: true

  # 2. Frontend Web Service (Next.js App)
  - type: web
    name: leaf-and-grain-frontend
    runtime: node
    plan: free
    rootDir: leaf-and-grain
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: NEXT_PUBLIC_API_URL
        fromService:
          type: web
          name: leaf-and-grain-backend
          property: host
